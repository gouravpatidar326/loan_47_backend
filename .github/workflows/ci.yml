name: Backend CI

# Build, validate, security-scan and (optionally) build the Docker image for the
# Point.47 LMS backend. Backward compatible — does not deploy by default.

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all source files
        run: |
          # Fail the build on any syntax error without needing a configured linter.
          find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: npm test --if-present

  security-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: npm audit (high+ severity)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [build-and-validate]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t point47-lms-backend:${{ github.sha }} .
